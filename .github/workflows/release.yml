name: Release macOS build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v1.0.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    env:
      FLUTTER_VERSION: 3.38.10
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PACKAGE_ARCH: arm64

    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            tag="${{ github.event.release.tag_name }}"
          else
            tag="${{ inputs.tag }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Validate pubspec version
        shell: bash
        run: |
          pubspec_version="$(awk '/^version:/ {print $2}' pubspec.yaml | cut -d+ -f1)"
          if [[ "$pubspec_version" != "${{ steps.release.outputs.version }}" ]]; then
            echo "Tag and pubspec versions do not match." >&2
            exit 1
          fi

      - name: Install Flutter SDK
        shell: bash
        run: |
          git clone https://github.com/flutter/flutter.git \
            --depth 1 \
            --branch "$FLUTTER_VERSION" \
            "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Build release artifacts
        run: ./scripts/build_release_artifacts.sh

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PerfectC2PA-${{ steps.release.outputs.version }}-macos-arm64
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error

      - name: Upload assets to GitHub Release
        shell: bash
        run: |
          gh release upload "${{ steps.release.outputs.tag }}" \
            --repo "$GH_REPO" \
            dist/*.dmg \
            dist/*.sha256 \
            --clobber
